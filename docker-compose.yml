services:
  db:
    image: postgres:16-alpine
    container_name: bank_ideas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # E01: só a API acessa o banco (rede interna do Docker). A porta fica
    # publicada apenas em 127.0.0.1 para um cliente SQL local; não é exposta à rede.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      #- ./database/seeds.sql:/docker-entrypoint-initdb.d/seeds.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"   # instala pytest/httpx (requirements-dev.txt)
    container_name: bank_ideas_api
    restart: unless-stopped
    # E01: API sem autenticação -> só acessível neste computador.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Sem cache do pytest: ele criaria /app/.pytest_cache e pastas temporárias
      # que derrubam o reloader do uvicorn (FileNotFoundError no StatReload).
      PYTEST_ADDOPTS: "-p no:cacheprovider"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    # E02: saudável só quando /health responde (testa o banco com SELECT 1).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app
      # Testes ficam fora de app/; montados para rodar "docker compose exec api pytest -q"
      - ./backend/tests:/app/tests

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bank_ideas_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      # Anonymous volume: keeps the container's own node_modules
      # (installed during build) instead of letting the bind mount
      # above overwrite it with your host's (possibly empty/missing) one.
      - /app/node_modules
    # E01: o navegador chama /api no próprio frontend e o Vite repassa para
    # http://api:8000 (vite.config.js). Não há mais URL fixa da API.
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data: