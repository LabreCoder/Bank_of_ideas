services:
  db:
    image: postgres:16-alpine
    container_name: bank_ideas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/seeds.sql   # <- adicionar essa linha
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bank_ideas_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bank_ideas_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Anonymous volume: keeps the container's own node_modules
      # (installed during build) instead of letting the bind mount
      # above overwrite it with your host's (possibly empty/missing) one.
      - /app/node_modules
    environment:
      # This URL is used by the BROWSER (see explanation below),
      # so it must be an address your host machine can reach.
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data: