# Alembic (X03) — migrações versionadas do banco.
# Comandos (sempre pelo container):
#   docker compose exec api alembic upgrade head      # aplica as pendentes (também roda ao subir a API)
#   docker compose exec api alembic current           # versão atual do banco
#   docker compose exec api alembic revision --autogenerate -m "descricao"
#   docker compose exec api alembic check             # models x banco sem diferenças?
# A URL do banco vem de database/connection.py (variáveis DB_* do .env).

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
