# E03: frontend de produção (build estático) + proxy /api para a API.
# Mesmo contrato do dev server do Vite: o navegador chama /api/... e o
# prefixo /api é removido antes de repassar para http://api:8000.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sem versão do nginx nos cabeçalhos/páginas de erro.
    server_tokens off;

    # API: a barra final em proxy_pass remove o prefixo /api.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome (gerados pelo Vite) podem ficar em cache por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: rotas como /ideas/3 ou /planning/new devolvem o index.html
    # (o React Router resolve no navegador).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
